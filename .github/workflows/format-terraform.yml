name: Format Terraform sources

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/format-terraform.yml"

permissions:
  contents: write

concurrency:
  group: terraform-format-${{ github.ref }}
  cancel-in-progress: false

jobs:
  format-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"
          terraform_wrapper: false

      - name: Format Terraform files
        run: terraform fmt -recursive

      - name: Commit formatting changes
        shell: bash
        run: |
          if [[ -n "$(git status --porcelain -- '*.tf')" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -u -- '*.tf'
            git commit -m "Apply Terraform formatting"
            git push origin HEAD:main
          else
            echo "All Terraform files already formatted."
          fi

      - name: Initialize without backend
        run: terraform -chdir=terraform init -backend=false

      - name: Validate Terraform
        run: terraform -chdir=terraform validate
