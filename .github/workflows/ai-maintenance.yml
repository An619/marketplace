name: AI maintenance (review via PR)

on:
  workflow_dispatch:
    inputs:
      task:
        description: "Optional one-run task override (otherwise uses .github/AI_TASK.md)"
        required: false
        type: string
  schedule:
    # Once daily, offset from the top of the hour to reduce scheduling delays.
    - cron: "17 3 * * *"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: ai-maintenance-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ai-maintenance:
    if: github.repository == 'An619/marketplace'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Validate AI provider configuration
        env:
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
        run: |
          if [ -z "$AI_API_KEY" ]; then
            echo "::error::Missing AI_API_KEY secret. Add an API key for a supported OpenAI-compatible provider in Settings > Secrets and variables > Actions."
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Aider
        run: python -m pip install --disable-pip-version-check aider-chat

      - name: Create isolated working branch
        id: branch
        shell: bash
        run: |
          branch="automation/ai-maintenance-$(date -u +%Y%m%d-%H%M%S)"
          git switch -c "$branch"
          echo "name=$branch" >> "$GITHUB_OUTPUT"

      - name: Run bounded AI maintenance task
        env:
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          AI_BASE_URL: ${{ vars.AI_BASE_URL }}
          AI_MODEL: ${{ vars.AI_MODEL }}
          TASK_OVERRIDE: ${{ inputs.task }}
        shell: bash
        run: |
          set -euo pipefail
          export OPENAI_API_KEY="$AI_API_KEY"
          export OPENAI_API_BASE="${AI_BASE_URL:-https://api.deepseek.com}"
          model="${AI_MODEL:-deepseek-chat}"
          if [ -n "${TASK_OVERRIDE:-}" ]; then
            printf '%s\n' "$TASK_OVERRIDE" > /tmp/ai-task.md
            task_file=/tmp/ai-task.md
          else
            task_file=.github/AI_TASK.md
          fi
          aider --model "openai/$model" --yes-always --no-auto-commits --message-file "$task_file" --no-show-model-warnings

      - name: Check change size and safety
        id: changes
        shell: bash
        run: |
          set -euo pipefail
          git status --short
          changed="$(git diff --name-only)"
          if [ -z "$changed" ]; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            echo "AI made no changes; no PR will be created."
            exit 0
          fi
          count="$(printf '%s\n' "$changed" | wc -l)"
          if [ "$count" -gt 5 ]; then
            echo "::error::AI changed more than 5 files; refusing to publish this run."
            exit 1
          fi
          if printf '%s\n' "$changed" | grep -E '(^|/)(\.env|.*\.pem|.*\.key)$|(^|/)terraform\.tfstate'; then
            echo "::error::Potential secret/state file detected; refusing to publish this run."
            exit 1
          fi
          echo "has_changes=true" >> "$GITHUB_OUTPUT"

      - name: Run Maven formatting check
        if: steps.changes.outputs.has_changes == 'true'
        run: mvn -B spotless:check

      - name: Run Maven verification
        if: steps.changes.outputs.has_changes == 'true'
        run: mvn -B clean verify -Pcoverage

      - name: Commit and push branch
        if: steps.changes.outputs.has_changes == 'true'
        env:
          BRANCH_NAME: ${{ steps.branch.outputs.name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore(ai): automated maintenance proposal"
          git push --set-upstream origin "$BRANCH_NAME"

      - name: Open review pull request
        if: steps.changes.outputs.has_changes == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH_NAME: ${{ steps.branch.outputs.name }}
        run: |
          gh pr create             --base main             --head "$BRANCH_NAME"             --title "chore(ai): automated maintenance proposal"             --body "Automated proposal generated from .github/AI_TASK.md (or the manual task override). Maven formatting and verification ran before this PR was opened. Please review the diff and workflow logs; this automation never merges or deploys changes automatically."
