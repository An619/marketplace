name: Publish microservice images

on:
  push:
    branches: [main]
    paths:
      - 'pom.xml'
      - 'common-library/**'
      - 'gateway-service/**'
      - 'identity-service/**'
      - 'product-service/**'
      - 'seller-service/**'
      - 'buyer-service/**'
      - 'category-service/**'
      - 'inventory-service/**'
      - 'pricing-service/**'
      - 'workflow-service/**'
      - 'notification-service/**'
      - 'search-service/**'
      - 'ai-service/**'
      - 'audit-service/**'
      - 'subscription-service/**'
      - 'report-service/**'
      - 'admin-service/**'
      - 'docker/Dockerfile.service'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Build and publish ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - gateway-service
          - identity-service
          - product-service
          - seller-service
          - buyer-service
          - category-service
          - inventory-service
          - pricing-service
          - workflow-service
          - notification-service
          - search-service
          - ai-service
          - audit-service
          - subscription-service
          - report-service
          - admin-service

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.service
          build-args: |
            SERVICE_MODULE=${{ matrix.service }}
          push: true
          tags: |
            ghcr.io/an619/marketplace-${{ matrix.service }}:sha-${{ github.sha }}
            ghcr.io/an619/marketplace-${{ matrix.service }}:latest
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

# GHCR packages may be private by default. Configure package visibility or imagePullSecrets
# before deploying to a cluster that cannot authenticate. This workflow builds all 16
# service images on main and can consume significant CI minutes.
