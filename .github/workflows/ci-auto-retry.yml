name: Retry failed CI once

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main, develop]

permissions:
  actions: write
  contents: read

jobs:
  retry-failed-jobs:
    if: >-
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.run_attempt == 1 &&
      github.repository == 'An619/marketplace'
    runs-on: ubuntu-latest
    steps:
      - name: Retry failed CI jobs once
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh api --method POST "repos/$REPOSITORY/actions/runs/$RUN_ID/rerun-failed-jobs"
          {
            echo "### CI retry requested"
            echo "- Original run: [$RUN_ID](https://github.com/$REPOSITORY/actions/runs/$RUN_ID)"
            echo "- Retried failed jobs once. If the retry fails, investigate the logs; no further automatic retries will occur."
          } >> "$GITHUB_STEP_SUMMARY"
